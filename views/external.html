<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=500" />
    <meta name="google" content="notranslate" />
    <link rel="stylesheet" href="./assets/fonts/index.css" />
    <title>Pali | External</title>
    <style>
      /* Reset any default margins/padding */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Initial loading screen styles */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #07152b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      #initial-loader .logo-container {
        display: flex;
        gap: 12px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      #initial-loader h1 {
        color: #4da2cf;
        font-family: 'Poppins', sans-serif;
        font-size: 37.87px;
        line-height: 37.87px;
        letter-spacing: 0.379px;
        margin: 0;
      }

      #initial-loader .bold {
        font-weight: 700;
      }

      #initial-loader .light {
        font-weight: 300;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Hide loader when React app is ready */
      body.app-loaded #initial-loader {
        opacity: 0;
        pointer-events: none;
      }

      /* Ensure the app root is hidden until ready */
      #external-root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body.app-loaded #external-root {
        opacity: 1;
      }

      @media (max-width: 399px) {
        #external-root .min-w-popup {
          min-width: 0;
          width: 100%;
        }
      }

      /* Short approval windows must not center a 620px layout beyond the
       * viewport. Keep the normal popup geometry at 620px and above. */
      @media (max-height: 619px) {
        html,
        body {
          height: 100vh;
          height: 100dvh;
        }

        #external-root .min-h-popup {
          min-height: 0;
        }

        #external-root .min-h-popup[data-navigation-scroll='wallet-layout'] {
          height: 100%;
          min-height: 0;
          max-height: 100%;
        }
      }

      /* In a short transaction popup, give the detail scroller the space
       * below the header so its final rows can clear the fixed actions. */
      @media (max-height: 499px) {
        #external-root
          [data-navigation-scroll='wallet-layout']:has(
            > .animate-fadeIn > [data-transaction-review]
          ) {
          display: flex;
          flex-direction: column;
        }

        #external-root
          [data-navigation-scroll='wallet-layout']:has(
            > .animate-fadeIn > [data-transaction-review]
          )
          > * {
          flex-shrink: 0;
        }

        #external-root
          [data-navigation-scroll='wallet-layout']
          > .animate-fadeIn:has(> [data-transaction-review]) {
          flex: 1 1 0%;
          min-height: 0;
        }

        #external-root [data-transaction-review] {
          height: 100%;
          min-height: 0;
        }
      }

      /* The toolbar-size and narrow external flows retain their normal layout. */
      @media (min-width: 621px), (min-height: 621px) {
        html {
          --pali-viewport-footer-clearance: var(
            --pali-toast-footer-clearance,
            0px
          );
        }

        #external-root [data-pali-approval-surface] {
          --pali-approval-height: min(100dvh, 800px);
          /* Review scroll offsets are panel-relative, while toasts are viewport-relative. */
          --pali-toast-footer-clearance: max(
            0px,
            calc(
              var(--pali-viewport-footer-clearance) -
                (100dvh - var(--pali-approval-height)) / 2
            )
          );
          height: var(--pali-approval-height);
          min-height: 0;
          contain: layout;
        }

        #external-root
          [data-pali-approval-surface]
          [data-navigation-scroll='wallet-layout'] {
          height: 100%;
          min-height: 0;
          max-height: 100%;
        }

        #external-root [data-pali-approval-surface] .h-screen {
          height: var(--pali-approval-height);
        }

        #external-root
          [data-pali-approval-surface]
          [data-navigation-scroll='wallet-layout']:has(
            > .animate-fadeIn > .h-screen
          ) {
          display: flex;
          flex-direction: column;
        }

        #external-root
          [data-pali-approval-surface]
          [data-navigation-scroll='wallet-layout']:has(
            > .animate-fadeIn > .h-screen
          )
          > * {
          flex-shrink: 0;
        }

        #external-root
          [data-pali-approval-surface]
          [data-navigation-scroll='wallet-layout']
          > .animate-fadeIn:has(> .h-screen) {
          flex: 1 1 0%;
          min-height: 0;
        }

        #external-root
          [data-pali-approval-surface]
          [data-navigation-scroll='wallet-layout']
          > .animate-fadeIn
          > .h-screen {
          height: 100%;
          min-height: 0;
        }

        #external-root
          [data-pali-approval-surface]
          .h-screen
          > .overflow-y-auto {
          scroll-padding-bottom: var(--pali-toast-footer-clearance, 0px);
        }
      }
    </style>
  </head>
  <body
    class="remove-scrollbar bg-bkg-6 overflow-hidden h-screen w-screen flex items-center justify-center"
  >
    <!-- Initial loading screen that shows immediately -->
    <div id="initial-loader">
      <div class="logo-container">
        <h1 class="bold">Pali</h1>
        <h1 class="light">Wallet</h1>
      </div>
    </div>

    <div
      id="external-root"
      class="w-full h-full flex items-center justify-center"
    />

    <script src="assets/js/appLoader.js"></script>
  </body>
</html>
