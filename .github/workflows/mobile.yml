name: Mobile foundation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/mobile/**'
      - 'source/shared/**'
      - 'source/wallet/**'
      - 'source/constants/trustedApps.json'
      - 'source/types/network.ts'
      - 'source/types/utxoTransaction.ts'
      - 'source/scripts/Background/controllers/assets/nft-utils.ts'
      - 'source/utils/asyncMutex.ts'
      - 'source/utils/dappOrigin.ts'
      - 'source/utils/defaultNetworks.ts'
      - 'source/utils/ethersV6Compat.ts'
      - 'source/utils/smartAccount/contracts.ts'
      - 'source/utils/smartAccount/deployment.ts'
      - 'source/utils/smartAccount/deploymentMetadata.ts'
      - 'source/utils/smartAccount/guardianStatus.ts'
      - 'source/utils/evmNonce.ts'
      - 'source/utils/evmReplacement.ts'
      - 'source/utils/evmTransactionContext.ts'
      - 'source/utils/nativeBalance.ts'
      - 'source/utils/nftTokenId.ts'
      - 'source/utils/personalSignReview.ts'
      - 'source/utils/privacy/note.ts'
      - 'source/utils/privacy/merkle.ts'
      - 'source/utils/privacy/merklePath.ts'
      - 'source/utils/privacy/ownedAnchor.ts'
      - 'source/utils/privacy/publicSyncProtocol.ts'
      - 'source/utils/privacy/privateVaultTypes.ts'
      - 'source/utils/privacy/registry.ts'
      - 'source/utils/privacy/snapshotValidation.ts'
      - 'source/utils/privacy/trustedSnapshot.ts'
      - 'source/utils/privacy/transactionTypes.ts'
      - 'source/utils/privacy/types.ts'
      - 'source/utils/privacy/withdrawalTransactionTypes.ts'
      - 'source/utils/requestPayloadBudget.ts'
      - 'source/utils/psbtWorkBudget.ts'
      - 'source/utils/slhDsa/constants.ts'
      - 'source/utils/slhDsa/hex.ts'
      - 'source/utils/syscoinAssetAmount.ts'
      - 'source/utils/syscoinPsbtValues.ts'
      - 'source/utils/utxoAcknowledgedInputs.ts'
      - 'source/utils/tokenDiscovery.ts'
      - 'source/utils/watchOnlyIdentifier.ts'
      - 'source/assets/all_assets/favicon-128.png'
      - '.github/workflows/mobile.yml'
      - '.github/scripts/configure-chromium-sandbox.sh'
      - '.github/scripts/tests/configure-chromium-sandbox.test.cjs'
      - '.nvmrc'

permissions:
  contents: read

concurrency:
  group: mobile-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Mobile types, behavior and bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Reject moderate and higher dependency advisories
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx --no-install playwright install --with-deps chromium
      - name: Validate Chromium sandbox helper admission
        run: node --test ../../.github/scripts/tests/configure-chromium-sandbox.test.cjs
      - name: Verify installed Chromium sandbox helper
        run: bash ../../.github/scripts/configure-chromium-sandbox.sh
      - run: npm run test:ui
      - run: npm run test:activity-ui
      - run: npm run test:watch-ui
      - run: npm run test:faucet-ui
      - name: Validate native recovery UI
        run: npm run test:recovery-ui
      # These validate the platform dependency graphs, not native binaries or
      # device custody. Actual native custody is checked by its separate workflow.
      - run: npx --no-install expo export --platform android --max-workers 2 --output-dir dist-android
      - run: npx --no-install expo export --platform ios --max-workers 2 --output-dir dist-ios
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/mobile/test-results/
            apps/mobile/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
