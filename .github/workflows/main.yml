on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  test:
    name: yarn test-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '23.11.1'
          check-latest: true
      - run: yarn install
      - run: yarn test-all
  recovery-enrollment:
    name: Pali recovery enrollment interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '23.11.1'
      - run: yarn install --frozen-lockfile
      - name: Install pinned local EVM toolchain
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Check out reviewed recovery backend
        uses: actions/checkout@v7
        with:
          repository: syscoin/sysnode-backend
          ref: 47aab836f81e74a2ddb019b523b026da2882c07c
          path: .recovery-backend-fixture
          persist-credentials: false
      - name: Install backend fixture dependencies
        working-directory: .recovery-backend-fixture
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        run: npm ci
      - name: Verify actual Pali signing against real local ERC1271
        env:
          RECOVERY_BACKEND_ROOT: ${{ github.workspace }}/.recovery-backend-fixture
          RECOVERY_ENROLLMENT_EVIDENCE_DIR: ${{ runner.temp }}/pali-recovery-enrollment
        run: yarn test:recovery-enrollment
      - name: Upload isolated integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-enrollment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pali-recovery-enrollment/
          retention-days: 14
  visual:
    name: visual regression shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    # Isolated runners retain one worker and all evidence without raising the limit.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '23.11.1'
          check-latest: true
      - run: yarn install
      - name: Resolve Playwright browser version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Resolve OS package cache key
        id: apt-cache-key
        run: |
          . /etc/os-release
          echo "platform=${ID}-${VERSION_ID}-$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"
          # No restore-keys fallback across week/dependency/image boundaries.
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright OS package downloads
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pali-playwright-apt/*.deb
          key: playwright-apt-v1-${{ steps.apt-cache-key.outputs.platform }}-${{ steps.apt-cache-key.outputs.image }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('yarn.lock', 'package.json', '.github/workflows/main.yml') }}-${{ steps.apt-cache-key.outputs.week }}
      - name: Verify restored archives against fresh apt metadata
        run: |
          shopt -s nullglob
          archives=("${RUNNER_TEMP}/pali-playwright-apt/"*.deb)
          if [ "${#archives[@]}" -eq 0 ]; then exit 0; fi
          sudo apt-get update -o APT::Update::Error-Mode=any
          for archive in "${archives[@]}"; do
            # apt may trust a pre-existing archive's size; require its SHA256
            # from signed repository metadata before allowing cached reuse.
            if [ -f "$archive" ] && [ ! -L "$archive" ] &&
              package="$(dpkg-deb --field "$archive" Package)" &&
              version="$(dpkg-deb --field "$archive" Version)" &&
              architecture="$(dpkg-deb --field "$archive" Architecture)" &&
              [[ "$package" =~ ^[a-z0-9][a-z0-9+.-]*$ ]] &&
              [[ "$version" =~ ^[0-9][A-Za-z0-9.+:~-]*$ ]] &&
              [[ "$architecture" =~ ^[a-z0-9][a-z0-9-]*$ ]] &&
              [ "$(basename "$archive")" = "${package}_${version//:/%3a}_${architecture}.deb" ] &&
              hashes="$(apt-cache show -- "$package=$version" 2>/dev/null | awk '/^SHA256: / { print $2 }')" &&
              [ -n "$hashes" ]; then
              actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
              if grep -Fxq "$actual" <<< "$hashes"; then
                continue
              fi
            fi
            # Missing, obsolete, or mismatched metadata: discard and redownload.
            rm -f -- "$archive"
          done
      - name: Configure temporary apt download archive
        run: |
          mkdir -p "${RUNNER_TEMP}/pali-playwright-apt"
          # Cache only package archives, never apt lists or installed dpkg state.
          # A separate directory also avoids image hooks cleaning /var/cache/apt/archives.
          printf 'Dir::Cache::archives "%s";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' \
            "${RUNNER_TEMP}/pali-playwright-apt" | sudo tee /etc/apt/apt.conf.d/99pali-playwright-cache >/dev/null
      # Still refreshes signed apt indexes and installs current dependencies on
      # every runner. Cache hits do not skip package installation or verification.
      - run: npx playwright install --with-deps chromium
      - name: Remove temporary apt configuration
        if: always()
        run: sudo rm -f /etc/apt/apt.conf.d/99pali-playwright-cache
      - name: Save Playwright OS package downloads
        # One immutable-cache writer avoids shard races. PR caches remain scoped
        # to their merge ref; no privileged trigger or shared writable cache.
        if: success() && matrix.shard == 1 && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pali-playwright-apt/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Build extension
        run: yarn build:chrome
      - name: Enforce production bundle budgets
        # Check the shipped artifact, not late-emitted build-only metadata.
        run: |
          PACKAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/pali-package-budget.XXXXXX")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          unzip -q "build/pali-wallet-production-chrome-${PACKAGE_VERSION}.zip" -d "$PACKAGE_DIR"
          node scripts/check-bundle-size.js "$PACKAGE_DIR"
      - name: Require smart-account hydration browser regression discovery
        run: yarn e2e:visual --list smartAccountHydration.spec.ts
      - name: Run visual baselines
        env:
          PALI_E2E_RUN_ID: pr-visual-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          PALI_TEST_DAPP_REVISION: ${{ github.sha }}
          PALI_TEST_DAPP_EXTENSION_PATH: ${{ github.workspace }}/build/chrome
        # Linux baselines are committed under e2e/visual/__screenshots__/linux/.
        # A screen without a committed baseline FAILS the job but writes the
        # generated baseline into the artifact below: download it, commit the
        # new linux png(s), and re-run. Changed screens fail with a diff.
        run: yarn e2e:visual --update-snapshots=missing --shard=${{ matrix.shard }}/2 --workers=1
      - name: Require completed visual journey summaries
        run: node e2e/scripts/check-summary-completion.cjs "e2e/artifacts/pr-visual-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}"
      - name: Upload visual artifacts (diffs + new baselines)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-artifacts-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            e2e/visual/__screenshots__/
            e2e/artifacts/
          retention-days: 14
  visual-result:
    name: visual regression suite
    if: always()
    needs: visual
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every visual shard to succeed
        run: test '${{ needs.visual.result }}' = 'success'
  conformance:
    name: test dapp conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: test-dapp-conformance-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '23.11.1'
          check-latest: true
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Install local conformance chain fixture
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Check out pinned Sentry backend for complete signing handoff
        uses: actions/checkout@v7
        with:
          repository: syscoin/sysnode-backend
          ref: 4312e660cfa9a06a03a398cecf40a87c904bb095
          path: .sentry-backend-fixture
          persist-credentials: false
      - name: Install Sentry adapter fixture dependencies
        working-directory: .sentry-backend-fixture
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        # Only the pure adapter runs; native SQLite and service lifecycle scripts are not used.
        run: npm ci --omit=dev --ignore-scripts
      - name: Build extension
        run: yarn build:chrome
      - name: Check isolated approval layout hit targets
        run: yarn jest --runInBand --coverage=false --runTestsByPath e2e/layout/switchChainLayout.spec.tsx --testPathIgnorePatterns /node_modules/
      - name: Prepare immutable legacy upgrade artifacts
        id: upgrade_artifacts
        run: |
          STORE_CRX="${RUNNER_TEMP}/pali-store-4.0.0.crx"
          LEGACY_ZIP="${RUNNER_TEMP}/pali-store-4.0.0.zip"
          EVIDENCE_DIR="${GITHUB_WORKSPACE}/e2e/artifacts/pr-conformance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${EVIDENCE_DIR}"
          curl --fail --location --retry 2 --output "${STORE_CRX}" \
            'https://github.com/syscoin/pali-wallet/releases/download/v4.0.102/pali-wallet-store-upgrade-baseline-4.0.0.crx'
          node e2e/scripts/prepare-store-upgrade-artifact.cjs \
            "${STORE_CRX}" "${LEGACY_ZIP}" \
            4f051937f8efec9a1f5bc4fa046a3c8f5c1cb1958021838ed967876328fee734 \
            mgffkfbidihjpoaomajlbgchddlicgpn \
            > "${EVIDENCE_DIR}/store-crx-provenance.json"
          CURRENT_VERSION="$(node -p 'require("./package.json").version')"
          CURRENT_ZIP="${GITHUB_WORKSPACE}/build/pali-wallet-production-chrome-${CURRENT_VERSION}.zip"
          test -f "${CURRENT_ZIP}"
          CURRENT_SHA256="$(sha256sum "${CURRENT_ZIP}" | cut -d ' ' -f 1)"
          echo "current_zip=${CURRENT_ZIP}" >> "$GITHUB_OUTPUT"
          echo "current_sha256=${CURRENT_SHA256}" >> "$GITHUB_OUTPUT"
      - name: Run isolated test dapp conformance
        env:
          PALI_E2E_RUN_ID: pr-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          PALI_TEST_DAPP_REVISION: ${{ github.sha }}
          PALI_TEST_DAPP_EXTENSION_PATH: ${{ github.workspace }}/build/chrome
          SENTRY_BACKEND_ROOT: ${{ github.workspace }}/.sentry-backend-fixture
          PALI_QA_STRESS_MODE: quick
          PALI_LEGACY_EXTENSION_VERSION: 4.0.0
          PALI_LEGACY_EXTENSION_ZIP: ${{ runner.temp }}/pali-store-4.0.0.zip
          PALI_LEGACY_EXTENSION_SHA256: d2330273ec05a73f655e870c442b3be587e74fd5600d0028ed32df879e925253
          PALI_CURRENT_EXTENSION_ZIP: ${{ steps.upgrade_artifacts.outputs.current_zip }}
          PALI_CURRENT_EXTENSION_SHA256: ${{ steps.upgrade_artifacts.outputs.current_sha256 }}
        run: yarn e2e:harness test-dapp-conformance.journey.spec.ts provider-edge-cases.journey.spec.ts provider-property-toggle.journey.spec.ts utxo-psbt.journey.spec.ts native-send-preview.journey.spec.ts pending-native-max.journey.spec.ts delayed-indexer-native-max.journey.spec.ts offline-utxo-history.journey.spec.ts native-history-account-switch.journey.spec.ts spt-send-preview.journey.spec.ts spt-asset-matrix.journey.spec.ts sentry-operator.journey.spec.ts sentry-management-fees.journey.spec.ts sentry-wallet-authority.journey.spec.ts sentry-batch-import.journey.spec.ts sentry-governance-vote.journey.spec.ts offline-wallet-lifecycle.journey.spec.ts offline-cold-restart.journey.spec.ts offline-vault-isolation.journey.spec.ts offline-sustained-wallet-stress.journey.spec.ts offline-legacy-upgrade.journey.spec.ts
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/artifacts/
          retention-days: 14
  secrets:
    name: Create env file with gh secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '23.11.1'
          check-latest: true
      - run: yarn install
      - run: |
          touch .env
          echo REACT_APP_SEED_LAW_COOK=${{ secrets.SEED_LAW_COOK }} >> .env
          echo REACT_APP_SEED_PEACE_GLOBE=${{ secrets.SEED_PEACE_GLOBE }} >> .env
          echo REACT_APP_SEED_SWALLOW_HEALTH=${{ secrets.SEED_SWALLOW_HEALTH }} >> .env
