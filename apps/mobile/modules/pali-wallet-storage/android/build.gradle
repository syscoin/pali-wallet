plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.syscoin.pali.storage'
version = '1.0.0'

android {
  namespace 'org.syscoin.pali.storage'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version System.getenv('CMAKE_VERSION') ?: '3.22.1'
    }
  }
}

dependencies {
  // Use the same OkHttp and Okio API dependencies exported by the app's ReactAndroid pin.
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
